<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="星継ぎ">
<meta name="theme-color" content="#14101f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>星継ぎのサバイバー</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hud" class="hidden">
      <div id="xpbar"><div id="xpfill"></div><span id="lvtext">Lv 1</span></div>
      <div id="hudrow">
        <div id="timer">0:00</div>
        <div class="hudstat">💀 <b id="kills">0</b></div>
        <div class="hudstat">🪙 <b id="gold">0</b></div>
        <div id="floorText"></div>
        <div class="spacer"></div>
        <button id="speedBtn" class="hudbtn">x1</button>
        <button id="pauseBtn" class="hudbtn">Ⅱ</button>
      </div>
      <div id="wslots"></div>
      <button id="specialBtn"><span>必殺</span><div id="specialFill"></div></button>
    </div>
  </div>
  <div id="screen"></div>
  <div id="modal" class="hidden"></div>
  <div id="toast"></div>
</div>
<script src="assets/manifest.js"></script>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/assets.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
