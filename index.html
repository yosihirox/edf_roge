<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDF ローグライト・ディフェンス</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="stat"><span>WAVE</span><b id="wave">0</b></div>
    <div class="stat"><span>ベース</span><b id="baseHp">100</b></div>
    <div class="stat"><span>SP</span><b id="sp">0</b></div>
    <div class="stat lv"><span>Lv</span><b id="level">1</b><div class="xp"><div id="xpFill"></div></div></div>
    <div class="stat"><span>アーマー</span><b id="armor">0</b></div>
    <div class="stat"><span>敵</span><b id="enemyCount">0</b></div>
    <div class="stat diff" id="diffName"></div>
    <div class="spacer"></div>
    <button id="speedBtn">速度 x1</button>
    <button id="pauseBtn">Ⅱ 一時停止</button>
    <button id="quitBtn">撤退</button>
  </header>
  <div id="radio">📻 本部より各隊へ。</div>
  <div id="stage">
    <canvas id="game" width="800" height="480"></canvas>
    <div id="unitInfo" class="hidden">
      <div id="unitText"></div>
      <button id="sellBtn">回収</button>
    </div>
  </div>
  <footer>
    <div id="deployBar"></div>
    <button id="waveBtn">▶ ウェーブ開始</button>
  </footer>
  <div id="help">配置: 兵科を選んで経路以外のマスをクリック（Shift+クリックで連続配置） / 1〜4: 兵科選択 / Space: ウェーブ開始 / F: 速度 / P: 一時停止 / 右クリック・Esc: キャンセル / S: 選択ユニット回収</div>

  <!-- タイトル -->
  <div id="title" class="overlay">
    <div class="panel title-panel">
      <img id="titleArt" src="assets/img/title.png" alt="" onerror="this.remove()">
      <h1>EDF<small>ローグライト・ディフェンス</small></h1>
      <p class="lead">押し寄せる巨大生物からベースを守れ。<br>レベルが上がるたびに3枚のカードから装備を選び、部隊を強化せよ。</p>
      <h3>作戦地域</h3><div id="mapSelect" class="choices"></div>
      <h3>難易度</h3><div id="diffSelect" class="choices"></div>
      <button id="startBtn" class="big">出撃</button>
      <p id="metaInfo" class="meta"></p>
      <button id="resetSave" class="small">記録リセット</button>
    </div>
  </div>

  <!-- カード選択 -->
  <div id="cards" class="overlay hidden">
    <div class="cards-wrap">
      <h2 id="cardTitle">強化を選択</h2>
      <div id="cardList"></div>
      <p class="hint">クリック、または 1〜3 キーで選択</p>
    </div>
  </div>

  <!-- 結果 -->
  <div id="result" class="overlay hidden">
    <div class="panel">
      <h2 id="resultTitle">作戦失敗</h2>
      <p id="resultText"></p>
      <button id="continueBtn" class="big hidden">エンドレスで続行</button>
      <button id="toTitle" class="big">タイトルへ</button>
    </div>
  </div>
</div>
<script src="assets/manifest.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
